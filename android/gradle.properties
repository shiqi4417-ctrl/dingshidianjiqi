org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m
android.useAndroidX=true
# 与 flutter create (3.47.5) 模板保持一致
android.newDsl=false
android.builtInKotlin=false

# [本机改动] 关闭 Kotlin 增量编译。
# 构建目录被模板重定位到 <root>/build，增量缓存写入时偶发
# "Could not close incremental caches" 导致编译失败，关闭后稳定。
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false

# 注意：不要在这里配置 HTTP 代理。
# 实测本机 storage.googleapis.com / maven.aliyun.com / repo1.maven.org 可直连，
# 而 dl.google.com 与 plugins.gradle.org 直连与代理均不可达，故改用阿里云镜像
# （见 settings.gradle.kts）。配置代理反而会导致可直连的域名解析失败。
